[project]
name = "advance-document-processing-tests"
version = "0"
requires-python = ">=3.10"
dependencies = [
    "pytest>=8",
    "rapidfuzz>=3",
    "numpy>=1.26",
    "scipy>=1.11",
]

# Unit tests for pure helpers only (the notebooks themselves are demos). Each
# bundle's helpers were extracted into a co-located module under bundle/src/, and
# the evaluation-harness nested scorer into evaluation-harness/src/; `pythonpath`
# makes those importable without a conftest, and `testpaths` keeps discovery to the
# per-project tests/ dirs.
[tool.pytest.ini_options]
testpaths = [
    "ai-extract-word-level-citation/tests",
    "document-page-classify-extraction/tests",
    "evaluation-harness/tests",
]
pythonpath = [
    "ai-extract-word-level-citation/bundle/src",
    "document-page-classify-extraction/bundle/src",
    "evaluation-harness/src",
]
