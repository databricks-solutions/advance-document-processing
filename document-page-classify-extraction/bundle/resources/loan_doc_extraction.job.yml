resources:
  jobs:
    loan_doc_extraction_streaming:
      name: "[${bundle.target}] Loan Doc Classify-Extract Streaming"

      schedule:
        quartz_cron_expression: "0 0/15 * * * ?"
        timezone_id: UTC
        pause_status: ${var.schedule_pause_status}

      max_concurrent_runs: 1

      # Serverless notebook environment pinned to env version 5
      # (ai_parse_document needs env v3+; ai_extract 2.1 needs env v3+ / DBR 18.2+)
      environments:
        - environment_key: serverless_v5
          spec:
            client: "5"

      tasks:
        - task_key: bronze_parse
          environment_key: serverless_v5
          notebook_task:
            notebook_path: ../src/01_bronze_parse.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              volume: ${var.volume}
              volume_subdir: ${var.volume_subdir}
              table_prefix: ${var.table_prefix}

        - task_key: silver_pages
          environment_key: serverless_v5
          depends_on:
            - task_key: bronze_parse
          notebook_task:
            notebook_path: ../src/02_silver_pages.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              volume: ${var.volume}
              volume_subdir: ${var.volume_subdir}
              table_prefix: ${var.table_prefix}

        - task_key: classify_pages
          environment_key: serverless_v5
          depends_on:
            - task_key: silver_pages
          notebook_task:
            notebook_path: ../src/03_classify_pages.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              volume: ${var.volume}
              volume_subdir: ${var.volume_subdir}
              table_prefix: ${var.table_prefix}

        - task_key: extract_fields
          environment_key: serverless_v5
          depends_on:
            - task_key: classify_pages
          notebook_task:
            notebook_path: ../src/04_extract_fields.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              volume: ${var.volume}
              volume_subdir: ${var.volume_subdir}
              table_prefix: ${var.table_prefix}

        - task_key: gold_merge
          environment_key: serverless_v5
          depends_on:
            - task_key: extract_fields
          notebook_task:
            notebook_path: ../src/05_gold_merge.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              volume: ${var.volume}
              volume_subdir: ${var.volume_subdir}
              table_prefix: ${var.table_prefix}
